<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DolphinSeek</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:Arial, sans-serif; background:linear-gradient(180deg,#e0f4ff,#0077be); min-height:100vh; display:flex; justify-content:center; align-items:center; }
.screen { display:none; width:90%; max-width:500px; background:white; border-radius:25px; padding:30px; text-align:center; box-shadow:0 10px 30px rgba(0,0,0,0.25); }
.active { display:block; }
.logo { font-size:5rem; }
h1 { color:#004c7a; margin:10px 0; }
p { color:#555; margin:10px 0; }
.version { display:flex; justify-content:center; gap:8px; flex-wrap:wrap; margin:15px 0; }
.version button { padding:10px 18px; border:2px solid #0077be; background:white; border-radius:20px; font-weight:bold; cursor:pointer; }
.version button.selected { background:#0077be; color:white; }
.next { padding:14px 30px; background:#ff7f50; color:white; border:none; border-radius:25px; font-size:1.2rem; cursor:pointer; }
</style>
</head>
<body>

<div id="s1" class="screen active">
<div class="logo">🐬🔍</div>
<h1>Welcome to DolphinSeek</h1>
<p>AI Creative Studio — 100% Offline</p>
<div class="version" id="versionBox">
<button data-v="Global">🌍 Global</button>
<button data-v="HK">🇭🇰 HK</button>
<button data-v="CN">🇨🇳 CN</button>
<button data-v="MY">🇲🇾 MY</button>
<button data-v="EU">🇪🇺 EU</button>
<button data-v="UK">🇬🇧 UK</button>
<button data-v="US">🇺🇸 US</button>
</div>
<button class="next" onclick="goNext()">Next →</button>
</div>

<div id="s2" class="screen">
<div class="logo">💬</div>
<h1>What is DolphinSeek?</h1>
<p>Your AI creative studio. Generate and edit photos, videos, and audio. All offline.</p>
<button class="next" onclick="enterGuest()">Start as Guest</button>
<br><br>
<button class="next" onclick="showLogin()">Login</button>
</div>

<div id="s3" class="screen">
<h1>Login</h1>
<input id="u" placeholder="Username" style="display:block;width:90%;margin:15px auto;padding:10px;border:2px solid #0077be;border-radius:15px;">
<input id="p" type="password" placeholder="Password" style="display:block;width:90%;margin:15px auto;padding:10px;border:2px solid #0077be;border-radius:15px;">
<button class="next" onclick="startApp()">Enter</button>
<br><br>
<button class="next" onclick="enterGuest()">Skip</button>
</div>

<div id="s4" class="screen">
<h1>DolphinSeek</h1>
<p id="who">Guest</p>
<div id="chat" style="background:#f0f8ff;border-radius:15px;padding:15px;height:200px;overflow-y:auto;text-align:left;color:#333;"></div>
<br>
<input id="msg" placeholder="Type a message..." style="width:80%;padding:10px;border:2px solid #0077be;border-radius:20px;">
<button class="next" onclick="send()">Send</button>
</div>

<script>
let selected = "Global";
let versionBox = document.getElementById("versionBox");
versionBox.addEventListener("click", function(e){
 if(e.target.tagName === "BUTTON"){
   document.querySelectorAll("#versionBox button").forEach(b => b.classList.remove("selected"));
   e.target.classList.add("selected");
   selected = e.target.dataset.v;
 }
});

function show(id){
 document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
 document.getElementById(id).classList.add("active");
}

function goNext(){ show("s2"); }
function enterGuest(){ document.getElementById("who").textContent = "Guest — " + selected; show("s4"); }
function showLogin(){ show("s3"); }
function startApp(){ document.getElementById("who").textContent = document.getElementById("u").value || "Guest"; show("s4"); }

function send(){
 let input = document.getElementById("msg");
 let chat = document.getElementById("chat");
 let text = input.value.trim();
 if(!text) return;
 chat.innerHTML += "<p><b>You:</b> " + text + "</p>";
 chat.innerHTML += "<p><b>AI:</b> I heard you: " + text + "</p>";
 input.value = "";
}
</script>

</body>
</html>
